<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime By Allrounder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: system-ui, sans-serif; }
        .shaka-video-container { position: absolute; inset: 0; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
    </style>
</head>
<body>
    <div class="shaka-video-container" data-shaka-player>
        <video autoplay playsinline preload="metadata"></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const fullUrl = params.get('url'); // Yeh aapke link se URL lega

            if (!fullUrl) {
                console.error("URL parameter missing");
                return;
            }

            // URL aur DRM ko alag-alag karna (pipe symbol | ke dwara)
            const [streamUrl, drmData] = fullUrl.split('|');
            const drmLicense = drmData.split('=')[2]; // drmLicense=keyID:key format se nikalna
            const [keyId, key] = drmLicense.split(':');

            shaka.polyfill.installAll();
            const video = document.querySelector('video');
            const player = new shaka.Player();
            await player.attach(video);
            new shaka.ui.Overlay(player, document.querySelector('.shaka-video-container'), video);

            player.configure({
                drm: { clearKeys: { [keyId]: key } }
            });

            try {
                await player.load(streamUrl);
            } catch (error) {
                console.error('Error loading stream:', error);
            }
        });
    </script>
</body>
</html>
