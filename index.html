<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
        .shaka-video-container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="shaka-video-container" data-shaka-player>
        <video autoplay playsinline></video>
    </div>

    <script>
        async function initPlayer() {
            const params = new URLSearchParams(window.location.search);
            const fullUrl = params.get('url');
            if (!fullUrl) return;

            const [streamUrl, drmData] = fullUrl.split('|');
            const [_, license] = drmData.split('drmLicense=');
            const [keyId, key] = license.split(':');

            const video = document.querySelector('video');
            const player = new shaka.Player();
            await player.attach(video);
            
            player.configure({ drm: { clearKeys: { [keyId]: key } } });

            try {
                await player.load(streamUrl);
            } catch (e) {
                console.error("Load Error:", e);
            }
        }
        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
