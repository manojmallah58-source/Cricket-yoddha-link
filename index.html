<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100vh; overflow: hidden; }
        .shaka-video-container { width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="shaka-video-container" data-shaka-player>
        <video autoplay playsinline></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const rawUrl = params.get('url');
            if (!rawUrl) return;

            const [streamUrl, drmData] = rawUrl.split('|');
            const [_, licenseInfo] = drmData.split('drmLicense=');
            const [keyId, key] = licenseInfo.split(':');

            const video = document.querySelector('video');
            const player = new shaka.Player();
            await player.attach(video);

            player.configure({
                drm: {
                    clearKeys: { [keyId]: key },
                    // Referrer header add karna taaki server block na kare
                    advanced: {
                        'com.widevine.alpha': {
                            videoRobustness: 'SW_SECURE_CRYPTO',
                            audioRobustness: 'SW_SECURE_CRYPTO'
                        }
                    }
                },
                streaming: { retryParameters: { timeout: 3000 } }
            });

            try {
                await player.load(streamUrl);
            } catch (e) {
                console.error("Error loading:", e);
                alert("Stream load nahi ho rahi. Check karein ki link active hai ya nahi.");
            }
        });
    </script>
</body>
</html>
